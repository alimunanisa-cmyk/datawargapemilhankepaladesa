<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Data Kependudukan Warga</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .spin-anim { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col md:flex-row justify-between items-stretch md:items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-white p-2.5 rounded-xl shadow-md shrink-0">
                    <i class="fa-solid fa-id-card text-xl"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-bold text-base sm:text-lg tracking-tight leading-none text-white">Sistem Data Kependudukan Real-Time</h1>
                        <span id="syncBadge" class="bg-emerald-500/20 text-emerald-400 text-[10px] font-medium px-2.5 py-1 rounded-full border border-emerald-500/30 flex items-center gap-1.5">
                            <span class="relative flex h-2 w-2">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                            </span>
                            <span id="syncBadgeText">Live Real-Time Sync</span>
                        </span>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1">Terhubung Langsung dengan Google Sheets (Master Data)</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <div class="flex items-center bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-slate-300">
                    <i class="fa-solid fa-clock text-amber-400 mr-1.5"></i>
                    <span class="mr-1 text-[11px]">Interval:</span>
                    <select id="autoSyncIntervalSelect" onchange="changeAutoSyncInterval(this.value)" class="bg-slate-900 text-white text-xs border border-slate-600 rounded px-1.5 py-0.5 focus:outline-none focus:ring-1 focus:ring-brand-500">
                        <option value="5000" selected>5 Detik</option>
                        <option value="10000">10 Detik</option>
                        <option value="30000">30 Detik</option>
                        <option value="0">Manual (Off)</option>
                    </select>
                </div>

                <button onclick="syncSpreadsheetData()" id="btnSync" class="flex-1 md:flex-none justify-center bg-brand-600 hover:bg-brand-500 active:scale-95 text-white px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center shadow-sm" title="Sinkronkan Sekarang">
                    <i class="fa-solid fa-rotate mr-1.5" id="iconSync"></i> Sync Sekarang
